name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      signed:
        description: Build signed distribution installers (requires signing secrets)
        type: boolean
        default: false
      cuda_only:
        description: Build only Windows CUDA packages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: metadata
        run: node scripts/release.mjs metadata ${{ inputs.cuda_only && '--cuda-only' || '' }}
      - name: Test release packaging and publication rules
        run: npm run test:packaging

  bundle:
    name: Bundle (${{ matrix.os }}, ${{ matrix.flavor }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    # Set CUDA_RUNNER_LABELS only after the local Windows runner is online.
    # Other platforms keep using GitHub-hosted runners.
    runs-on: ${{ matrix.flavor == 'cuda' && fromJSON(vars.CUDA_RUNNER_LABELS || '["windows-2022"]') || matrix.os }}
    timeout-minutes: 120
    env:
      RELEASE_SIGNING_REQUIRED: ${{ github.event_name == 'push' || inputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ runner.environment != 'self-hosted' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clear previous package outputs
        run: node scripts/release.mjs clean

      - run: npm ci

      - name: Test Windows packaging rules
        run: npm run test:packaging

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        if: runner.environment != 'self-hosted'
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.flavor }}
          cache-on-failure: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev libdbus-1-dev libasound2-dev pkg-config patchelf file \
            build-essential cmake clang llvm libclang-dev

      - name: Ensure LLVM (libclang for bindgen)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $libclangDirectory = $env:LIBCLANG_PATH
          if (-not $libclangDirectory) { $libclangDirectory = 'C:\Program Files\LLVM\bin' }
          if (-not (Test-Path (Join-Path $libclangDirectory 'libclang.dll'))) {
            if ($env:RUNNER_ENVIRONMENT -eq 'self-hosted') {
              throw 'Install LLVM or set LIBCLANG_PATH for the local runner account before running this workflow.'
            }
            choco install llvm -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'LLVM installation failed.' }
          }
          "LIBCLANG_PATH=$libclangDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build frontend
        run: npm run build

      - name: Check Rust
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --locked

      # Tag builds require signing. Manual unsigned builds are test artifacts.
      - name: Build signed and notarized macOS bundles
        if: runner.os == 'macOS' && env.RELEASE_SIGNING_REQUIRED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret: $name (see README release setup)."
              exit 1
            fi
          done
          npm run tauri -- build --ci -- --locked
          codesign --verify --deep --strict src-tauri/target/release/bundle/macos/Transcriptor.app
          xcrun stapler validate src-tauri/target/release/bundle/macos/Transcriptor.app

      - name: Build signed Windows installer
        if: runner.os == 'Windows' && env.RELEASE_SIGNING_REQUIRED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          foreach ($name in @('WINDOWS_CERTIFICATE', 'WINDOWS_CERTIFICATE_PASSWORD', 'WINDOWS_TIMESTAMP_URL')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              throw "Missing signing setting: $name (see README release setup)."
            }
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'transcriptor-signing.pfx'
          $config = Join-Path $env:RUNNER_TEMP 'transcriptor-signing.json'
          $certificate = $null
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
              Where-Object HasPrivateKey | Select-Object -First 1
            if (-not $certificate) { throw 'Signing certificate has no private key.' }
            @{ bundle = @{ windows = @{
              certificateThumbprint = $certificate.Thumbprint
              digestAlgorithm = 'sha256'
              timestampUrl = $env:WINDOWS_TIMESTAMP_URL
            } } } | ConvertTo-Json -Depth 4 | Set-Content $config
            if ('${{ matrix.flavor }}' -eq 'cuda') {
              & ./scripts/build-windows-cuda.ps1 -SigningConfig $config
            } else {
              npm run tauri -- build --ci --config $config -- --locked
            }
            if ($LASTEXITCODE -ne 0) { throw 'Windows bundle build failed.' }
            $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
            if ($installers.Count -eq 0) { throw 'No Windows installer was produced.' }
            foreach ($installer in $installers) {
              if ((Get-AuthenticodeSignature $installer.FullName).Status -ne 'Valid') {
                throw "Installer signature failed: $($installer.Name)"
              }
            }
            if ('${{ matrix.flavor }}' -eq 'cuda') {
              $portable = 'src-tauri/target/windows-cuda/portable/transcriptor.exe'
              if ((Get-AuthenticodeSignature $portable).Status -ne 'Valid') {
                throw 'Portable CUDA executable signature failed.'
              }
            }
          } finally {
            Remove-Item $pfx, $config -Force -ErrorAction SilentlyContinue
            if ($certificate) { Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force }
          }

      - name: Build Linux bundle or unsigned test bundles
        if: matrix.flavor != 'cuda' && (runner.os == 'Linux' || env.RELEASE_SIGNING_REQUIRED != 'true')
        run: npm run tauri -- build --ci --no-sign -- --locked

      - name: Build unsigned Windows CUDA test packages
        if: matrix.flavor == 'cuda' && env.RELEASE_SIGNING_REQUIRED != 'true'
        shell: pwsh
        run: ./scripts/build-windows-cuda.ps1 -Unsigned

      - name: Stage release packages
        env:
          RELEASE_PLATFORM: ${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}
          RELEASE_FLAVOR: ${{ matrix.flavor }}
        run: node scripts/release.mjs stage "$RELEASE_PLATFORM" "$RELEASE_FLAVOR"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.prepare.outputs.version }}-${{ runner.os }}-${{ matrix.flavor }}-${{ env.RELEASE_SIGNING_REQUIRED == 'true' && 'release' || 'unsigned-test' }}
          path: release-assets/
          if-no-files-found: error
          compression-level: 0

      - name: Upload CUDA build diagnostics
        if: always() && matrix.flavor == 'cuda'
        uses: actions/upload-artifact@v4
        with:
          name: cuda-build-diagnostics
          path: |
            src-tauri/target/cargo-timings/*.html
            src-tauri/target/release/build/whisper-rs-sys-*/output
            src-tauri/target/release/build/whisper-rs-sys-*/stderr
          if-no-files-found: ignore

  publish:
    name: Publish GitHub Release
    needs: [prepare, bundle]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*-release
          path: release-assets/
          merge-multiple: true
      - name: Upload verified packages and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs publish
