name: Release

on:
  push:
    tags: ["v*"]

jobs:
  bundle:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev libdbus-1-dev libasound2-dev pkg-config patchelf file \
            build-essential cmake clang llvm libclang-dev

      - name: Ensure LLVM (libclang for bindgen)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) {
            choco install llvm -y --no-progress
          }
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Unsigned bundles: .app/.dmg (macOS), NSIS .exe (Windows), AppImage (Linux).
      - name: Build bundles
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: transcriptor-${{ github.ref_name }}-${{ runner.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
